plugins:
  - jekyll-sitemap

# Jekyll の既定除外。これに加え、サイトへ出したくない画像を外す。
# 画像ファイル自体はリポジトリに残す。README は GitHub 上の説明用で、サイトには出さない。
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - images/icon_facebook.png
  - images/icon_instagram.png
  - images/icon_twitter.png
  - images/icon_youtube.png
  - images/sample1.jpg
  - images/sample1_big.jpg
  - images/sample2.jpg
  - images/sample3.jpg
  - images/_1.jpg
  - images/_2.jpg
  - images/_3.jpg
  - images/logo_.png
  - images/logo__.png
  - images/seko/583043.jpg
  - images/seko/583044.jpg
  - images/seko/583045.jpg
  - images/seko/583046.jpg
  - images/seko/583047.jpg
  - images/seko/583048.jpg
  - images/seko/583049.jpg
  - images/seko/583050.jpg
  - images/seko/バッテリー修理

defaults:
  - scope:
      path: "google421b7cae58fe3ffa.html"
    values:
      sitemap: false
